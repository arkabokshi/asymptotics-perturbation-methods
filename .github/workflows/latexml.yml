name: Build Site (LaTeXML + PDF)

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
      - "**.sty"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Build PDF (your working method) ---
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: notes.tex

      # --- Install LaTeXML ---
      - name: Install LaTeXML and TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml texlive-latex-extra texlive-extra-utils

      # --- Expand LaTeX ---
      - name: Expand LaTeX
        run: |
          latexpand notes.tex > expanded.tex

      # --- Convert to HTML ---
      - name: Convert LaTeX → HTML
        run: |
          mkdir -p public
          latexmlc expanded.tex \
            --dest=public/index.html \
            --split \
            --navigationtoc=context \
            --tocdepth=2 \
            --mathimages=false \
            --tolerant

      # --- Copy PDF into site ---
      - name: Add PDF to site
        run: |
          cp notes.pdf public/
          echo '<p><a href="notes.pdf">Download PDF version</a></p>' >> public/index.html

      # --- Deploy to GitHub Pages ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
