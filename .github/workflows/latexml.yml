name: Build HTML Site (LaTeXML)

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
      - "**.sty"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeXML and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml latexml-common

      - name: Expand LaTeX (handles \include cleanly)
        run: |
          sudo apt-get install -y latexpand
          latexpand main.tex > expanded.tex

      - name: Convert LaTeX → HTML (split site)
        run: |
          mkdir -p public
          latexmlc expanded.tex \
            --dest=public/index.html \
            --split \
            --navigationtoc=context \
            --tocdepth=2 \
            --mathimages=false \
            --tolerant

      - name: Add PDF download link (optional but useful)
        run: |
          cp main.pdf public/ || true
          echo '<p><a href="main.pdf">Download PDF version</a></p>' >> public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
