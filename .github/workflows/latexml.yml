name: Build HTML Site (LaTeXML)

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
      - "**.sty"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeXML and TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml texlive-latex-extra texlive-extra-utils

      - name: Expand LaTeX (handles \include cleanly)
        run: |
          latexpand main.tex > expanded.tex

      - name: Convert LaTeX → HTML (split site)
        run: |
          mkdir -p public
          latexmlc expanded.tex \
            --dest=public/index.html \
            --split \
            --navigationtoc=context \
            --tocdepth=2 \
            --mathimages=false \
            --tolerant

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
